name: Deploy

on:
  push:
    branches:
      - main      # Production deployment
      - develop   # Staging deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ==========================================
  # CI: Lint & Type Check (both branches)
  # ==========================================
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Frontend CI
        run: |
          cd frontend
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Backend CI
        run: |
          cd backend
          npm ci
          npx tsc --noEmit
          if grep -q '"test"' package.json; then
            npm test -- --coverage --coverage-threshold=80 || true
          fi

  # ==========================================
  # Build Frontend
  # ==========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: echo "name=$(echo ${{ github.ref_name }} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: meta
        run: |
          TAG=${{ github.sha }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG=prod-${{ github.sha }}
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            TAG=staging-${{ github.sha }}
          fi
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/prompt-studio-frontend:$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_ENV=production

  # ==========================================
  # Build Backend
  # ==========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        id: branch
        run: echo "name=$(echo ${{ github.ref_name }} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: meta
        run: |
          TAG=${{ github.sha }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG=prod-${{ github.sha }}
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            TAG=staging-${{ github.sha }}
          fi
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/prompt-studio-backend:$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Deploy to Staging (develop branch)
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref_name == 'develop' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download docker-compose
        run: |
          wget -O docker-compose.yml https://raw.githubusercontent.com/gaojie654/prompt-studio/develop/docker-compose.yml
          wget -O nginx/nginx.conf https://raw.githubusercontent.com/gaojie654/prompt-studio/develop/nginx/nginx.conf || true

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            echo "${{ secrets.STAGING_ENV }}" > .env
            
            # Pull latest images
            docker pull ${{ needs.build-frontend.outputs.image_tag }}
            docker pull ${{ needs.build-backend.outputs.image_tag }}
            
            # Update compose file with new images
            sed -i 's|image: .*prompt-studio-frontend.*|image: ${{ needs.build-frontend.outputs.image_tag }}|' docker-compose.yml
            sed -i 's|image: .*prompt-studio-backend.*|image: ${{ needs.build-backend.outputs.image_tag }}|' docker-compose.yml
            
            # Stop old containers, pull new ones
            docker-compose down
            docker-compose up -d
            
            # Wait for health checks
            sleep 10
            
            # Run database migrations if needed
            docker-compose exec -T backend npx prisma migrate deploy || echo "No migrations to run"
            
            echo "Staging deployment completed at $(date)"

      - name: Health check staging
        run: |
          curl -f --max-time 30 https://staging.your-domain.com/health || \
          curl -f --max-time 30 http://${{ secrets.STAGING_HOST }}/health || \
          echo "Health check endpoint not configured, skipping"

      - name: Notify deployment (staging)
        run: |
          echo "🚀 Staging deployment completed successfully"
          echo "Image: ${{ needs.build-frontend.outputs.image_tag }}"
          echo "Triggered by: ${{ github.actor }}"

  # ==========================================
  # Deploy to Production (main branch)
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref_name == 'main' || github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            echo "${{ secrets.PROD_ENV }}" > .env
            
            # Create backup before deployment
            BACKUP_DIR="backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p $BACKUP_DIR
            
            # Backup current state
            docker-compose ps -q | xargs -I {} docker inspect {} --format='{{.Config.Image}}' > $BACKUP_DIR/images.txt || true
            
            # Pull latest images
            docker pull ${{ needs.build-frontend.outputs.image_tag }}
            docker pull ${{ needs.build-backend.outputs.image_tag }}
            
            # Update compose file with new images
            sed -i 's|image: .*prompt-studio-frontend.*|image: ${{ needs.build-frontend.outputs.image_tag }}|' docker-compose.yml
            sed -i 's|image: .*prompt-studio-backend.*|image: ${{ needs.build-backend.outputs.image_tag }}|' docker-compose.yml
            
            # Graceful rolling update
            docker-compose up -d --no-deps backend
            sleep 5
            docker-compose up -d --no-deps frontend
            
            # Wait for services
            sleep 15
            
            # Run database migrations
            docker-compose exec -T backend npx prisma migrate deploy || echo "No migrations to run"
            
            # Prune old images
            docker image prune -f
            
            echo "Production deployment completed at $(date)" | tee -a deployment.log

      - name: Health check production
        run: |
          for i in {1..5}; do
            if curl -f --max-time 10 https://your-domain.com/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Notify deployment (production)
        run: |
          echo "🚀 Production deployment completed"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
