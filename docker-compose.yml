version: '3.9'

services:
  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: prompt-studio-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates (uncomment and configure for HTTPS)
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - prompt-studio-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: prompt-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptstudio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-promptstudio}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-promptstudio} -d ${POSTGRES_DB:-promptstudio}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prompt-studio-network

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: prompt-studio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prompt-studio-network

  # ==========================================
  # Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prompt-studio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_API_URL: ${SILICONFLOW_API_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Kolors}
      WECHAT_MCHID: ${WECHAT_MCHID}
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO}
      WECHAT_PRIVATE_KEY_PATH: ${WECHAT_PRIVATE_KEY_PATH:-/app/config/apiclient_key.pem}
      WECHAT_APIV3_KEY: ${WECHAT_APIV3_KEY}
      WECHAT_APPID: ${WECHAT_APPID}
      ALIPAY_APPID: ${ALIPAY_APPID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_ALIPUBLIC_KEY: ${ALIPAY_ALIPUBLIC_KEY}
      ALIPAY_SANDBOX: ${ALIPAY_SANDBOX:-false}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/uploads/images}
      LOCAL_STORAGE_BASE_URL: ${LOCAL_STORAGE_BASE_URL:-http://localhost/uploads/images}
    ports:
      - '3000:3000'
    volumes:
      - backend_uploads:/app/uploads
      # WeChat payment private key (mount if using WeChat Pay)
      # - ./config/apiclient_key.pem:/app/config/apiclient_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prompt-studio-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # Frontend (Static)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prompt-studio-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_APP_ENV: ${VITE_APP_ENV:-production}
    depends_on:
      - backend
    networks:
      - prompt-studio-network

  # ==========================================
  # Optional: pgAdmin (Database GUI)
  # ==========================================
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: prompt-studio-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@prompt.studio
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
  #   ports:
  #     - '5050:80'
  #   depends_on:
  #     - postgres
  #   networks:
  #     - prompt-studio-network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  prompt-studio-network:
    driver: bridge
